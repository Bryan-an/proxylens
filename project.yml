name: ProxyLens

options:
  bundleIdPrefix: com.proxylens
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  ProxyLensCore:
    path: Packages/ProxyLensCore
  ProxyLensApplication:
    path: Packages/ProxyLensApplication
  ProxyLensCapture:
    path: Packages/ProxyLensCapture
  ProxyLensPersistence:
    path: Packages/ProxyLensPersistence
  ProxyLensPlatform:
    path: Packages/ProxyLensPlatform

targets:
  ProxyLens:
    type: application
    platform: macOS
    sources:
      - path: ProxyLensApp
        excludes:
          - "**/*.entitlements"
    info:
      path: ProxyLensApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: ProxyLens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.proxylens.session
            UTTypeDescription: ProxyLens Session
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - proxylens
          - UTTypeIdentifier: com.proxylens.rule-profile
            UTTypeDescription: ProxyLens Rule Profile
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - proxylensrules
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.proxylens.ProxyLens
        PRODUCT_NAME: ProxyLens
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ProxyLensApp/Resources/ProxyLens.entitlements
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: ProxyLensCore
        product: ProxyLensCore
      - package: ProxyLensApplication
        product: ProxyLensApplication
      - package: ProxyLensCapture
        product: ProxyLensCapture
      - package: ProxyLensPersistence
        product: ProxyLensPersistence
      - package: ProxyLensPlatform
        product: ProxyLensPlatform

  ProxyLensIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ProxyLensIntegrationTests
    dependencies:
      - target: ProxyLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  ProxyLensUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/ProxyLensUITests
    dependencies:
      - target: ProxyLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ProxyLens:
    build:
      targets:
        ProxyLens: all
        ProxyLensIntegrationTests: [test]
        ProxyLensUITests: [test]
    test:
      targets:
        - name: ProxyLensIntegrationTests
        - name: ProxyLensUITests
