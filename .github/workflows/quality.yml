name: Quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --find swift-format

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run quality checks
        env:
          CI: "true"
        run: ./scripts/quality.sh ci
